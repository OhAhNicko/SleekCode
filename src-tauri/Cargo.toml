[package]
name = "made"
version = "0.3.1"
description = "AI Terminal Workspace"
authors = ["you"]
edition = "2021"
# The crate now produces TWO binaries, so a bare `cargo run` becomes ambiguous —
# and `tauri dev` runs exactly that. Without this line the dev loop stops with
# "could not determine which binary to run"; it must never be removed while the
# adapter bin exists.
default-run = "made"

[lib]
name = "made_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The MCP stdio adapter every CLI launches. Standalone by construction: it does
# NOT `use made_lib`, because linking the app's lib would drag tauri, wgpu and
# WebView2 into a process whose whole job is to relay NDJSON between a stdin
# pipe and a loopback socket. The few helpers it needs are duplicated (~30
# lines); the wire structs it mirrors from knowledge/ipc.rs are pinned by a
# shared JSON fixture test on both sides.
#
# HOW IT SHIPS: as a second bin of THIS package, and by that route only. Tauri's
# build runs a whole-package `cargo build`, so this lands in target/<profile>/
# beside made.exe, and the bundler installs every bin of the package into the
# app directory — which is exactly where `mcp_config::adapter_exe_path` looks.
#
# It must NOT also be declared as `bundle.externalBin`. Doing both installs the
# same file into the same directory from two WiX components, and MSI's ICE30
# validation rejects that outright ("installed by two different components"),
# failing the whole release. NSIS silently tolerates it, so the MSI target is
# the only thing that catches the mistake.
#
# The dev loop needs one extra nudge, and this is the asymmetry to remember:
# `tauri dev` runs `cargo RUN`, which builds only the selected bin — that is why
# `default-run` above exists at all — so a fresh clone would have no adapter in
# target/debug and every Settings row would report it missing. Hence the
# explicit `cargo build --bin made-knowledge-mcp` in `beforeDevCommand`
# (tauri.conf.json), which is JSON and cannot carry this note itself.
[[bin]]
name = "made-knowledge-mcp"
path = "src/bin/made-knowledge-mcp/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: decode the bundled icons/variants/*.png for the runtime
# app-icon picker (set_app_icon_variant).
tauri = { version = "2", features = ["devtools", "image-png"] }
tauri-plugin-opener = "2"
# Recycle Bin deletes for the file-tree context menu (never remove_dir_all).
trash = "5"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS toast notifications while the window is minimized (pane notifications).
tauri-plugin-notification = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# "time" is for knowledge/: the watcher's trailing debounce, the event
# coalescer's 150ms flush and the IPC handshake deadline are all tokio timers.
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# NexusMind knowledge service (knowledge/). The per-project store lives in
# app_local_data_dir, NEVER inside the project: a WAL SQLite file opened across
# the \\wsl.localhost SMB share reliably reports "database is locked" — the same
# trap already documented for Codex's state_5.sqlite. The markdown projection in
# <project>/.project-memory/ is the portable copy, and the DB is rebuildable
# from it. `bundled` compiles the amalgamation with cl.exe (already required for
# the tauri build) so the shipped SQLite is a known one, with FTS5.
rusqlite = { version = "0.32", features = ["bundled"] }
# Entity ids (kn_/rel_/cfl_/ho_/tk_ + a v4 simple) and the loopback IPC token.
# Already in the tree transitively via tauri/wry; this makes it a direct dep.
uuid = { version = "1", features = ["v4"] }

# MCP server SDK for the `made-knowledge-mcp` bin. `server` is a default feature
# bundling schemars + transport-async-rw; `transport-io` is the stdio adapter and
# pulls tokio's io-std transitively.
#
# EXACT-pinned: rmcp is a young SDK that has already reshaped its handler traits
# between minor versions, and a silent bump would break the one binary the CLIs
# launch — with the failure showing up as "server disconnected" inside someone
# else's tool, not as a build error here.
#
# A NORMAL dependency, deliberately not `optional = true` + `required-features`:
# a feature-gated dep would make cargo compile made_lib twice (once with the
# feature for the bin, once without for the app). rustc drops it from made.exe
# anyway, because the lib never names it.
rmcp = { version = "=3.1.1", features = ["server", "transport-io"] }

# Live-reload for the text editor (file_watch.rs). Watches the parent directory
# of every open file non-recursively so atomic saves (write-temp + rename) don't
# silently kill the watch, and emits `made:file-changed` to the frontend.
notify = "6"

# native_term (Phase 0 spike — child HWND + wgpu)
wgpu = "22"
raw-window-handle = "0.6"
crossbeam-channel = "0.5"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# native_term R1: terminal parser + glyph rendering. Versions chosen for
# wgpu 22 lockstep — glyphon 0.6 pins wgpu 22 exactly. Bumping wgpu later
# requires bumping glyphon in tandem (see plan risk #2).
glyphon = "0.6"
alacritty_terminal = "0.24"
unicode-width = "0.2"
regex = "1"

# WebView2 COM uses windows 0.61. The native terminal code above uses
# windows 0.58, so keep the WebView2 Windows types under an alias.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows-webview2 = { package = "windows", version = "0.61.3", features = ["Win32_Foundation"] }

# browser_view: the native browser pane hosts its webview with wry DIRECTLY
# rather than through Tauri. This is a SECURITY decision, not a convenience one —
# a Tauri-hosted webview injects the invoke key into every page's main frame with
# no origin gate (tauri manager/webview.rs:176) over an IPC transport any page can
# reach (wry webview2/mod.rs:880-886), and app commands skip the ACL entirely
# because MADE declares no app manifest (tauri webview/mod.rs:1802, build.rs).
# A visited site could therefore read __TAURI_INVOKE_KEY__ and call read_file /
# write_file / pty_spawn. Hosting with wry means no Tauri bootstrap, no invoke key
# and no command bridge exist in that webview at all; the only IPC is the single
# DevTools envelope validated in browser_view::policy.
#
# PINNED to the exact version tauri-runtime-wry already resolves (see Cargo.lock)
# so the process has ONE WebView2 integration, not two. Re-check on every tauri
# bump: a drift here means two wry copies and two WebView2 environments.
wry = "=0.54.2"

# Unix (macOS/Linux) only: alacritty_terminal 0.24 -> rustix-openpty 0.1.1 pulls
# rustix 0.38 WITHOUT its `std` feature, so rustix falls back to its no_std
# `OwnedFd` polyfill, which mismatches `std::os::fd::OwnedFd` in tty/unix.rs and
# breaks the build. Depending on rustix 0.38 with `std` here turns the feature on
# via cargo feature-unification, fixing the type mismatch. Windows is unaffected
# (it doesn't use the unix pty backend).
[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38", features = ["std"] }
