  <rect x="90" y="144" width="300" height="300" rx="66" fill="#92bcff"/>
  <rect x="56" y="178" width="300" height="300" rx="66" fill="#80e2ad"/>
  <path d="M 168 269 L 243 328 L 168 387"
        fill="none" stroke="#131313" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
